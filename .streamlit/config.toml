[theme]
primaryColor = "#2a78d6"

[server]
maxUploadSize = 500
# Keep a session (uploaded file, trained model, settings) alive for 24 hours after the browser tab
# disconnects, e.g. when the laptop sleeps. Streamlit's default is 2 minutes.
disconnectedSessionTTL = 86400
# Compress messages to the browser (helps through remote proxies such as SageMaker's), and ping every
# 20 seconds so idle-connection timeouts in proxies don't cut the app off during long training runs.
enableWebsocketCompression = true
websocketPingInterval = 20

[browser]
gatherUsageStats = false
